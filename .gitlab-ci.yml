stages:
  - build
  - deploy

variables:
  NODE_ENV: production

build:
  stage: build
  image: node:18-alpine
  before_script:
    - npm install -g pnpm
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - master
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_HOST "
        cd $DEPLOY_PATH &&
        git pull origin master &&
        npm install -g pnpm &&
        pnpm install --frozen-lockfile &&
        pnpm build &&
        npx prisma migrate deploy &&
        pm2 restart nfc-backend || pm2 start dist/server.js --name nfc-backend &&
        pm2 save
      "
  only:
    - master
    - main
  environment:
    name: production
